version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # A dependency joins the first group it matches, so order matters:
    # react must come before the dev-dependency catch-all so @types/react*
    # move together with react itself.
    groups:
      react:
        patterns:
          - "react"
          - "react-*"
          - "@types/react"
          - "@types/react-dom"
          - "@tanstack/react-query"
          - "@fortawesome/*"
        update-types:
          - "minor"
          - "patch"
      infra:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      runtime:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
